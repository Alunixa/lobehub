name: Codex Build Server Image

on:
  workflow_dispatch: {}
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: codex-server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build linux/amd64 OCI image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OCI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: false
          push: false
          outputs: type=docker,dest=/tmp/lobehub-server-image.tar
          provenance: false
          sbom: false
          tags: lobehub/lobehub:codex-${{ github.sha }}

      - name: Verify runtime dependencies
        run: |
          docker load --input /tmp/lobehub-server-image.tar
          docker run --rm --entrypoint /bin/node --workdir /app \
            lobehub/lobehub:codex-${{ github.sha }} \
            -e "require.resolve('@swc/helpers/esm/_interop_require_default.js'); require.resolve('next/dist/server/next-server.js')"

      - name: Upload OCI image
        uses: actions/upload-artifact@v4
        with:
          name: lobehub-server-image-${{ github.sha }}
          path: /tmp/lobehub-server-image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
