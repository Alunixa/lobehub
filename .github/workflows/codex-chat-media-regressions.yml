name: Codex Chat and Media Regression

on:
  workflow_dispatch: {}
  push:
    branches:
      - codex/**
    paths:
      - .github/workflows/codex-chat-media-regressions.yml
      - apps/server/src/**
      - packages/database/src/models/topic.ts
      - packages/database/src/models/__tests__/topic.test.ts
      - packages/database/src/models/notification.ts
      - packages/database/src/models/__tests__/notification.test.ts
      - packages/database/src/models/proactiveConversation.ts
      - packages/database/src/models/__tests__/proactiveConversation.test.ts
      - packages/fetch-sse/**
      - packages/model-runtime/**
      - packages/types/**
      - packages/env/src/app.ts
      - packages/utils/src/currentTime*
      - packages/utils/src/conversationAwareness*
      - packages/utils/src/client/**
      - src/**
      - public/proactive-push-sw.js
      - package.json
      - scripts/serverLauncher/**
      - tests/stream-reliability/**
      - tests/browser-responsiveness/**

permissions:
  contents: read

concurrency:
  group: codex-chat-media-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pnpm install
      - name: Chat stream and media regressions
        run: node node_modules/vitest/vitest.mjs run --config tests/stream-reliability/vitest.config.mts --silent=passed-only
      - name: Request history and failure-state regressions
        run: node node_modules/vitest/vitest.mjs run --config tests/chat-diagnostics/vitest.config.mts --silent=passed-only
      - name: Native request timing and connection diagnostics
        run: |
          node node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            apps/server/src/modules/AgentRuntime/llmRequestTiming.test.ts \
            apps/server/src/modules/ModelRuntime/connectionError.test.ts
      - name: Serializable transport cause regressions
        working-directory: packages/utils
        run: node ../../node_modules/vitest/vitest.mjs run --silent=passed-only src/error.test.ts
      - name: Optional conversation awareness, compression and autonomous follow-ups
        run: |
          node node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            src/features/ChatInput/compositionClock.test.ts \
            src/features/ChatInput/draftStorage.test.ts \
            src/features/ChatInput/store/action.test.ts \
            src/store/chat/slices/topic/action.test.ts \
            apps/server/src/modules/AgentRuntime/proactiveFooter.test.ts \
            apps/server/src/modules/ModelRuntime/compressImage.test.ts \
            apps/server/src/modules/ModelRuntime/modelMediaStorage.test.ts \
            apps/server/src/modules/S3/index.test.ts \
            apps/server/src/modules/ModelRuntime/compressTransport.test.ts \
            apps/server/src/modules/ModelRuntime/index.test.ts \
            apps/server/src/modules/ModelRuntime/ownedMediaHook.test.ts \
            apps/server/src/services/proactiveConversation/plan.test.ts \
            apps/server/src/services/proactiveConversation/dispatch.test.ts \
            apps/server/src/routers/lambda/topicCreation.test.ts \
            apps/server/src/services/proactiveConversation/completion.test.ts \
            apps/server/src/services/proactiveConversation/WebPushService.test.ts \
            apps/server/src/services/proactiveConversation/pushWorker.test.ts
      - name: Model-only timing context regressions
        working-directory: packages/utils
        run: node ../../node_modules/vitest/vitest.mjs run --silent=passed-only src/conversationAwareness.test.ts
      - name: Browser responsiveness and stream replay regressions
        run: node node_modules/vitest/vitest.mjs run --config tests/browser-responsiveness/vitest.config.mts --silent=passed-only
      - name: Context usage and cross-device recovery regressions
        run: |
          node node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            src/services/realtime/messageSubscription.test.ts \
            src/features/Conversation/MessageRealtimeSync.test.tsx \
            src/features/Conversation/ChatInput/utils.test.ts \
            src/features/ChatInput/ActionBar/Token/contextUsage.test.ts \
            src/hooks/useTokenCount.test.tsx \
            src/store/chat/slices/message/action.test.ts \
            src/store/chat/slices/topic/action.test.ts \
            apps/server/src/services/aiAgent/__tests__/execAgent.threadId.test.ts \
            scripts/serverLauncher/realtimeServer.test.mjs
      - name: Authenticated realtime bridge integration
        run: node node_modules/vitest/vitest.mjs run --silent=passed-only scripts/serverLauncher/realtimeServer.integration.test.mjs
      - name: Provider stream decoder regressions
        working-directory: packages/model-runtime
        run: |
          node ../../node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            src/core/streams/openai/openai.test.ts \
            src/core/streams/openai/responsesStream.test.ts \
            src/core/streams/anthropic.test.ts \
            src/core/streams/google/google-ai.test.ts \
            src/core/streams/protocol.test.ts
      - name: Provider request preparation regressions
        working-directory: packages/model-runtime
        run: |
          node ../../node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            src/core/ModelRuntime.test.ts \
            src/core/contextBuilders/openai.test.ts \
            src/core/contextBuilders/modelHostedMedia.test.ts \
            src/core/openaiCompatibleFactory/index.test.ts \
            src/core/openaiCompatibleFactory/streamingFetch.test.ts \
            src/core/openaiCompatibleFactory/nonStreamToStream.test.ts \
            src/providers/google/transport.test.ts \
            src/utils/handleOpenAIError.test.ts
      - name: Topic operation ownership and cleanup regressions
        working-directory: packages/database
        run: |
          node ../../node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            src/models/__tests__/topic.test.ts \
            src/models/__tests__/proactiveConversation.test.ts \
            src/models/__tests__/notification.test.ts
      - name: Attachment retention before model request encoding
        working-directory: packages/context-engine
        run: |
          node ../../node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            src/processors/__tests__/AttachmentRetention.test.ts \
            src/processors/__tests__/MessageContent.test.ts \
            src/engine/messages/__tests__/MessagesEngine.test.ts
