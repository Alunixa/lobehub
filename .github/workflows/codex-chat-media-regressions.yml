name: Codex Chat and Media Regression

on:
  workflow_dispatch: {}
  push:
    branches:
      - codex/**
    paths:
      - .github/workflows/codex-chat-media-regressions.yml
      - apps/server/src/**
      - packages/database/src/models/topic.ts
      - packages/database/src/models/message.ts
      - packages/database/src/models/__tests__/messages/**
      - packages/database/src/models/__tests__/topic.test.ts
      - packages/database/src/models/notification.ts
      - packages/database/src/models/__tests__/notification.test.ts
      - packages/database/src/models/proactiveConversation.ts
      - packages/database/src/models/__tests__/proactiveConversation.test.ts
      - packages/fetch-sse/**
      - packages/model-runtime/**
      - packages/types/**
      - packages/env/src/app.ts
      - packages/utils/src/currentTime*
      - packages/utils/src/contextContent*
      - packages/context-engine/**
      - packages/builtin-tool-image-generation/**
      - packages/builtin-tools/**
      - packages/utils/src/abort*
      - packages/utils/src/conversationImageModel*
      - packages/const/src/settings/systemAgent.ts
      - packages/conversation-flow/**
      - packages/utils/src/conversationAwareness*
      - packages/utils/src/client/**
      - src/**
      - public/proactive-push-sw.js
      - package.json
      - scripts/serverLauncher/**
      - tests/stream-reliability/**
      - tests/browser-responsiveness/**

permissions:
  contents: read

concurrency:
  group: codex-chat-media-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: pnpm install
      - name: Community catalogue access and resource lifecycle regressions
        run: |
          node node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 --testTimeout=15000 \
            apps/server/src/services/market/publicCatalog.test.ts \
            apps/server/src/services/market/publicCatalogClient.test.ts \
            apps/server/src/services/market/index.test.ts \
            apps/server/src/services/discover/index.test.ts \
            apps/server/src/services/skill/importer.test.ts \
            apps/server/src/routers/lambda/market/marketError.test.ts \
            src/services/discover.test.ts \
            src/services/installMarketplaceAgents.test.ts \
            src/libs/swr/normalizeError.test.ts \
            src/store/tool/slices/mcpStore/action.test.ts \
            'src/routes/(main)/settings/skill/features/SkillDetail/index.test.tsx'
      - name: Conversation structure, active branches and stack-safe long history
        working-directory: packages/conversation-flow
        run: node ../../node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2
      - name: Chat stream and media regressions
        run: node node_modules/vitest/vitest.mjs run --config tests/stream-reliability/vitest.config.mts --silent=passed-only
      - name: Request history and failure-state regressions
        run: node node_modules/vitest/vitest.mjs run --config tests/chat-diagnostics/vitest.config.mts --silent=passed-only
      - name: Native request timing and connection diagnostics
        run: |
          node node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            apps/server/src/modules/AgentRuntime/llmRequestTiming.test.ts \
            apps/server/src/modules/ModelRuntime/connectionError.test.ts
      - name: Serializable transport cause regressions
        working-directory: packages/utils
        run: node ../../node_modules/vitest/vitest.mjs run --silent=passed-only src/error.test.ts
      - name: Optional conversation awareness, compression and autonomous follow-ups
        run: |
          node node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            src/features/ChatInput/compositionClock.test.ts \
            src/features/ChatInput/draftStorage.test.ts \
            src/features/ChatInput/store/action.test.ts \
            src/store/chat/slices/topic/action.test.ts \
            apps/server/src/modules/AgentRuntime/proactiveFooter.test.ts \
            apps/server/src/modules/ModelRuntime/compressImage.test.ts \
            apps/server/src/modules/ModelRuntime/modelMediaStorage.test.ts \
            apps/server/src/modules/S3/index.test.ts \
            apps/server/src/modules/ModelRuntime/compressTransport.test.ts \
            apps/server/src/modules/ModelRuntime/index.test.ts \
            apps/server/src/modules/ModelRuntime/ownedMediaHook.test.ts \
            apps/server/src/services/proactiveConversation/plan.test.ts \
            apps/server/src/services/proactiveConversation/dispatch.test.ts \
            apps/server/src/routers/lambda/topicCreation.test.ts \
            apps/server/src/services/proactiveConversation/completion.test.ts \
            apps/server/src/services/proactiveConversation/WebPushService.test.ts \
            apps/server/src/services/proactiveConversation/pushWorker.test.ts
      - name: Completed topic filtering, navigation and recovery
        run: |
          node node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            src/features/AgentTopicManager/utils.test.ts \
            'src/routes/(main)/agent/_layout/Sidebar/Topic/List/Item/useDropdownMenu.test.tsx' \
            'src/routes/(main)/agent/_layout/Sidebar/Header/Nav.test.tsx'
      - name: Completed topic database filtering and pagination
        working-directory: packages/database
        run: node ../../node_modules/vitest/vitest.mjs run --silent=passed-only src/models/__tests__/topics/topic.query.test.ts
      - name: Model-only timing context regressions
        working-directory: packages/utils
        run: node ../../node_modules/vitest/vitest.mjs run --silent=passed-only src/conversationAwareness.test.ts
      - name: Browser responsiveness and stream replay regressions
        run: node node_modules/vitest/vitest.mjs run --config tests/browser-responsiveness/vitest.config.mts --silent=passed-only
      - name: Context usage and cross-device recovery regressions
        run: |
          node node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            src/services/realtime/messageSubscription.test.ts \
            src/features/Conversation/MessageRealtimeSync.test.tsx \
            src/features/Conversation/ChatInput/utils.test.ts \
            src/features/ChatInput/ActionBar/Token/contextUsage.test.ts \
            src/store/chat/slices/agentRun/actions/__tests__/conversationLifecycle.test.ts \
            src/store/chat/slices/agentRun/actions/__tests__/gateway.test.ts \
            src/store/chat/slices/agentRun/actions/clearBlankBucket.test.ts \
            apps/server/src/modules/AgentRuntime/__tests__/RuntimeExecutors.test.ts \
            apps/server/src/services/agentRuntime/AgentRuntimeService.test.ts \
            apps/server/src/services/agentRuntime/contextWindowTokens.test.ts \
            src/hooks/useTokenCount.test.ts \
            src/hooks/useTokenCount.test.tsx \
            src/store/chat/slices/message/action.test.ts \
            src/store/chat/slices/topic/action.test.ts \
            src/store/chat/slices/topic/model.test.ts \
            'src/routes/(main)/agent/_layout/Sidebar/Header/Nav.test.tsx' \
            src/store/chat/slices/topic/selectors.test.ts \
            src/store/chat/utils/messageReadConsistency.test.ts \
            src/features/Conversation/store/slices/data/action.race.test.ts \
            src/features/Conversation/store/slices/message/action/crud.test.ts \
            src/features/Conversation/store/slices/message/action/state.test.ts \
            src/features/Conversation/store/slices/message/action/sendMessage.test.ts \
            src/libs/swr/cacheProvider.integration.test.tsx \
            src/features/ChatInput/hooks/useEffectiveModel.test.ts \
            src/features/ChatInput/hooks/useEffectiveAgentMode.test.ts \
            src/store/chat/slices/agentRun/actions/__tests__/streamingExecutor.test.ts \
            apps/server/src/routers/lambda/__tests__/aiChat.test.ts \
            apps/server/src/services/aiAgent/__tests__/execAgent.topicHistory.test.ts \
            apps/server/src/services/aiAgent/__tests__/execAgent.threadId.test.ts \
            scripts/serverLauncher/realtimeServer.test.mjs
      - name: Authenticated realtime bridge integration
        run: |
          node node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            scripts/serverLauncher/realtimeServer.integration.test.mjs \
            scripts/serverLauncher/serverReady.test.mjs
      - name: Provider request errors and global background preferences
        run: |
          node node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            src/layout/SPAGlobalProvider/index.test.tsx \
            src/features/Conversation/Error/index.test.tsx \
            src/features/Conversation/Error/isProviderAuthError.test.ts \
            src/features/GlobalBackground/config.test.ts \
            src/features/GlobalBackground/useLoadedBackground.test.ts \
            src/features/Setting/GlobalBackgroundSetting/draftStorage.test.ts \
            src/features/Setting/GlobalBackgroundSetting/useBackgroundSetting.test.ts \
            src/services/background.test.ts \
            src/store/user/slices/settings/action.test.ts
      - name: Chat/Completions model-specific parameter compatibility
        working-directory: packages/model-runtime
        run: |
          node ../../node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            src/providers/openai/index.test.ts \
            src/providers/openai/chatCompletion.wire.test.ts
      - name: Provider stream decoder regressions
        working-directory: packages/model-runtime
        run: |
          node ../../node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            src/core/streams/openai/openai.test.ts \
            src/core/streams/openai/responsesStream.test.ts \
            src/core/streams/anthropic.test.ts \
            src/core/streams/google/google-ai.test.ts \
            src/core/streams/protocol.test.ts \
            src/utils/resolveSafeMaxTokens.test.ts
      - name: Semantic media token estimates
        working-directory: packages/utils
        run: node ../../node_modules/vitest/vitest.mjs run --silent=passed-only src/contextContent.test.ts
      - name: Provider request preparation regressions
        working-directory: packages/model-runtime
        run: |
          node ../../node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            src/core/ModelRuntime.test.ts \
            src/core/contextBuilders/openai.test.ts \
            src/core/contextBuilders/modelHostedMedia.test.ts \
            src/core/openaiCompatibleFactory/index.test.ts \
            src/core/openaiCompatibleFactory/streamingFetch.test.ts \
            src/core/openaiCompatibleFactory/nonStreamToStream.test.ts \
            src/providers/openai/chatCompletion.wire.test.ts \
            src/providers/minimax/index.test.ts \
            src/providers/google/transport.test.ts \
            src/utils/handleOpenAIError.test.ts
      - name: Topic operation ownership and cleanup regressions
        working-directory: packages/database
        run: |
          node ../../node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            src/models/__tests__/topic.test.ts \
            src/models/__tests__/topics/topic.create.test.ts \
            src/models/__tests__/topics/topic.update.test.ts \
            src/models/__tests__/topics/topicUsage.test.ts \
            src/models/__tests__/proactiveConversation.test.ts \
            src/models/__tests__/notification.test.ts
      - name: Active branch append and complete conversation reads
        working-directory: packages/database
        run: |
          node ../../node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            src/models/__tests__/messages/message.active-spine.test.ts \
            src/models/__tests__/messages/message.query.test.ts \
            src/models/__tests__/messages/message.thread-query.test.ts \
            src/models/__tests__/messages/queryWithMessageGroup.test.ts \
            src/models/__tests__/messages/regenerateBranchPrune.test.ts
      - name: Attachment retention before model request encoding
        working-directory: packages/context-engine
        run: |
          node ../../node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            src/processors/__tests__/AttachmentRetention.test.ts \
            src/processors/__tests__/MessageContent.test.ts \
            src/engine/messages/__tests__/MessagesEngine.test.ts
      - name: Context-aware image generation tool and cancellation
        run: |
          node node_modules/vitest/vitest.mjs run --silent=passed-only --maxWorkers=2 \
            apps/server/src/modules/Mecha/AgentToolsEngine/__tests__/index.test.ts \
            apps/server/src/services/conversationImage/index.test.ts \
            apps/server/src/services/generation/index.test.ts \
            apps/server/src/services/toolExecution/__tests__/errorClassification.test.ts \
            src/helpers/toolEngineering/index.test.ts \
            src/store/user/slices/settings/selectors/settings.test.ts
      - name: Image generation runtime and manifest contract
        working-directory: packages/builtin-tool-image-generation
        run: node ../../node_modules/vitest/vitest.mjs run --config vitest.config.mts --silent=passed-only src/ExecutionRuntime/index.test.ts src/manifest.test.ts
      - name: Image model setting and abort behavior
        working-directory: packages/utils
        run: node ../../node_modules/vitest/vitest.mjs run --silent=passed-only src/conversationImageModel.test.ts src/abort.test.ts
